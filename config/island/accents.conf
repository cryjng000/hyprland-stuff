# Island accent overrides.
#
#   <text matched against the wallpaper filename> = white | auto | #rrggbb
#
# First matching line wins; `auto` means "ignore any later rule and just use
# the automatic choice". Without a match the island decides for itself: a
# wallpaper that is mostly dark or grey gets the pale near-white accent, and
# anything with real colour in it gets a lifted version of that colour.
#
# These three are forced white by request. The automatic rule already picks
# white for all of them, so they are here as a guarantee, not a fix.
windows-11-dark = white
topographic-textures = white
27-golden-gate-dark = white
