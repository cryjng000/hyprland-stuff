# Colours generated by matugen from the current wallpaper.
include colors.conf

font_family      JetBrainsMono Nerd Font Light
bold_font        JetBrainsMono Nerd Font Medium
italic_font      JetBrainsMono Nerd Font Light Italic
bold_italic_font JetBrainsMono Nerd Font Medium Italic
font_size 13.0
# Ligatures everywhere except under the cursor, where -> collapsing into one
# glyph makes it hard to tell which character you are actually on.
disable_ligatures cursor

background_opacity 0.5
# Lets ctrl+shift+a then m / l nudge the opacity live without an edit+reload.
dynamic_background_opacity yes
confirm_os_window_close 0
scrollback_lines 20000
wheel_scroll_min_lines 1
enable_audio_bell no
window_padding_width 10

# --- cursor -----------------------------------------------------------------
# The trail: the cursor drags a tapering wedge behind it as it moves, which is
# what makes fast typing and big jumps read as a slice through the text.
#
# Needs kitty >= 0.36. Ubuntu 24.04 ships 0.32.2, which does not know the
# option and silently ignores it -- hence ~/.local/kitty.app, and hyprland.lua
# pointing at that binary by absolute path.
cursor_trail 3
#            ^ ms the cursor must have been still before a trail is drawn.
#              Small enough to catch typing, large enough that a TUI
#              repainting itself does not smear.
cursor_trail_decay 0.1 0.4
cursor_trail_start_threshold 1
#                            ^ cells of movement needed. The default of 2
#                              skips single-cell steps, i.e. exactly the
#                              typing you want to see.
cursor_shape beam
cursor_beam_thickness 1.8
cursor_blink_interval 0.5
cursor_stop_blinking_after 5.0

# --- chrome -----------------------------------------------------------------
url_style curly
undercurl_style thin-sparse
tab_bar_style powerline
tab_powerline_style slanted
# A notification when a slow command finishes in an unfocused window -- picked
# up by mako, which now matches the wallpaper too.
notify_on_cmd_finish unfocused 15.0
