# ~/.config/fuzzel/fuzzel.ini -- GENERATED BY MATUGEN. Do not edit here.
# Source template: ~/.config/matugen/templates/fuzzel.ini
#
# fuzzel is the fallback launcher (Super+D runs rofi); this keeps the two on
# the same palette so they don't look like two different desktops.
#
# fuzzel wants RRGGBBAA with NO leading '#' -- unlike mako/rofi/waybar. That
# is why every value below uses hex_stripped plus a two-digit alpha and
# nothing else.

# Size the font from pixels, not the monitor's (bogus) physical DPI.
dpi-aware=no

# Matches kitty (13.0) and the rest of the rice.
font=JetBrainsMono Nerd Font:size=13
line-height=26
letter-spacing=0
width=42
lines=12

horizontal-pad=24
vertical-pad=18
inner-pad=12

prompt="  "
icon-theme=Adwaita
image-size-ratio=0.9
layer=overlay

[border]
width=2
radius=16

[colors]
# Glass pane over Hyprland's blur, same 0.72-ish alpha the island opens at.
background={{colors.surface_container.default.hex_stripped}}b8
text={{colors.on_surface.default.hex_stripped}}ff
match={{colors.primary.default.hex_stripped}}ff
selection={{colors.primary_container.default.hex_stripped}}e6
selection-text={{colors.on_primary_container.default.hex_stripped}}ff
selection-match={{colors.tertiary.default.hex_stripped}}ff
border={{colors.outline.default.hex_stripped}}80
